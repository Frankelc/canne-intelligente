persistence true
persistence_location /mosquitto/data/
log_dest stdout
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Listener clair accessible uniquement aux conteneurs du réseau Docker privé.
# Il n'est pas publié sur l'hôte. Les connexions depuis l'ESP32 passent par TLS.
listener 1883
protocol mqtt

# TLS pour la canne et les clients externes.
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
